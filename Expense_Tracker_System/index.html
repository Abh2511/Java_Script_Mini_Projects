<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
   
</head>
<body>

    <main class="container">

        <header class="page-header">
            <div>
                <p class="eyebrow">PERSONAL FINANCE</p>
                <h1>Expense Tracker</h1>
                <p class="subtitle">
                    Keep an eye on your money.
                </p>
            </div>
        </header>

        <section class="summary">
            <article class="summary-card balance-card">
                <p>Remaining Balance</p>
                <h2 id="balance">₹0.00</h2>
            </article>

            <article class="summary-card">
                <p>Total Income</p>
                <h2 id="totalIncome">₹0.00</h2>
            </article>

            <article class="summary-card">
                <p>Total Expenses</p>
                <h2 id="totalExpenses">₹0.00</h2>
            </article>
        </section>

        <section class="content-grid">

            <section class="panel">
                <h2>Add Transaction</h2>

                <form id="transactionForm">

                    <label for="description">
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        placeholder="e.g. Monthly salary"
                        required
                    >

                    <label for="amount">
                        Amount (₹)
                    </label>

                    <input
                        type="number"
                        id="amount"
                        min="0.01"
                        step="0.01"
                        placeholder="Enter amount"
                        required
                    >

                    <label for="type">
                        Transaction Type
                    </label>

                    <select id="type" required>
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Salary">Salary</option>
                        <option value="Other">Other</option>
                    </select>

                    <label for="date">
                        Date
                    </label>

                    <input type="date" id="date" required>

                    <button type="submit" class="primary-btn">
                        Add Transaction
                    </button>

                    <p id="formMessage" class="form-message"></p>

                </form>
            </section>

            <section class="panel">
                <div class="history-header">
                    <h2>Transactions</h2>

                    <select id="filterType" aria-label="Filter transactions">
                        <option value="all">All</option>
                        <option value="income">Income</option>
                        <option value="expense">Expenses</option>
                    </select>
                </div>

                <div id="transactionList" class="transaction-list"></div>

                <p id="emptyMessage" class="empty-message">
                    No transactions yet.
                </p>
            </section>

        </section>

        <footer class="page-footer">
            Expense Tracker · HTML, CSS and JavaScript
        </footer>

    </main>
 <script src="script.js"></script>
</body>
</html>
